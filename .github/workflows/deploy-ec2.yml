name: Deploy API to EC2

# Auto-deploys the backend whenever main changes API-related code.
# One-time setup: add GitHub secrets listed in docs/ec2-auto-deploy.md
# workflow_dispatch: re-run manually from Actions if a push is skipped.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'scripts/deploy-ec2.sh'
      - '.github/workflows/deploy-ec2.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ec2-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull · Build · Restart on EC2
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets in GitHub → Settings → Secrets and variables → Actions"
            echo "See docs/ec2-auto-deploy.md"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT != '' && secrets.EC2_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/felk"
            fi
            export EC2_APP_DIR="$APP_DIR"
            export EC2_BRANCH=main
            export PM2_APP_NAME="${{ secrets.PM2_APP_NAME }}"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Cloning repo into $APP_DIR"
              mkdir -p "$(dirname "$APP_DIR")"
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "==> Freeing disk space before git fetch"
            df -h / | tail -1 || true
            pm2 flush 2>/dev/null || true
            rm -f "${HOME}/.pm2/logs/"*.log 2>/dev/null || true
            rm -f /tmp/felk-import-* /tmp/core* 2>/dev/null || true
            rm -rf "${APP_DIR}/.turbo" "${APP_DIR}/node_modules/.cache" "${APP_DIR}/apps/api/node_modules/.cache" 2>/dev/null || true
            if command -v pnpm >/dev/null 2>&1; then
              pnpm store prune >/dev/null 2>&1 || true
            fi
            sudo journalctl --vacuum-size=50M >/dev/null 2>&1 || true
            sudo apt-get clean >/dev/null 2>&1 || true
            rm -f "${APP_DIR}/.git/index.lock" 2>/dev/null || true
            git gc --prune=now 2>/dev/null || true
            df -h / | tail -1 || true

            # Ensure deploy script from this commit is present even before pull
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            chmod +x scripts/deploy-ec2.sh
            bash scripts/deploy-ec2.sh
